<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laboratorio · SQLearning</title>
  <link rel="icon" href="recursos/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="recursos/apple-touch-icon.png">
  <meta name="description" content="Practica SQL libremente con la base de datos de Faro, sin miedo a romper nada.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600&family=Sixtyfour:BLED,SCAN@0..100,-53..100&display=swap">
  <link rel="stylesheet" href="css/tema.css?v=202610151527">
  <link rel="stylesheet" href="css/fondo.css?v=202610151527">
  <link rel="stylesheet" href="css/editor.css?v=202610151527">
  <link rel="stylesheet" href="css/grafico.css?v=202610151527">
  <link rel="stylesheet" href="css/laboratorio.css?v=202610151527">
</head>
<body>
  <div class="escena escena--tenue" aria-hidden="true">
    <div class="escena-cielo"></div>
    <img class="escena-ciudad" src="recursos/ciudad-neon.svg" alt="">
    <div class="escena-suelo"></div>
  </div>

  <header class="lab-cabecera">
    <a class="marca" href="index.html#ruta" aria-label="SQLearning, volver a la hoja de ruta">
      <span class="marca-faro" aria-hidden="true"></span>
      <span>SQL<strong>earning</strong></span>
    </a>
    <div class="lab-titulo">
      <h1>Laboratorio</h1>
      <p>Practica libre con la base de datos de Faro. Nada de lo que hagas cambia los datos. <span class="lab-datos" data-datos-lab></span></p>
    </div>
    <div data-musica></div>
    <button type="button" class="boton-tema" data-tema aria-label="Cambiar tema">🌙 Noche</button>
  </header>

  <main class="lab" data-lab>
    <section class="lab-panel lab-editor" aria-label="Consulta">
      <div class="lab-barra">
        <button type="button" class="boton-principal" data-ejecutar disabled>▶ Ejecutar <kbd>Ctrl</kbd>+<kbd>Enter</kbd></button>
        <label class="lab-ejemplos">
          <span class="solo-lector">Cargar un ejemplo</span>
          <select data-ejemplos>
            <option value="">Ejemplos…</option>
          </select>
        </label>
        <button type="button" data-limpiar>Borrar</button>
      </div>
      <div class="lab-editor-caja" data-editor></div>
      <p class="lab-ayuda"><kbd>Ctrl</kbd>+<kbd>Espacio</kbd> sugerencias · <kbd>Tab</kbd> sangría · <kbd>Esc</kbd> y <kbd>Tab</kbd> para salir del editor</p>
    </section>

    <div class="lab-separador" role="separator" aria-orientation="vertical" aria-label="Cambiar el ancho de los paneles"
         tabindex="0" data-separador></div>

    <section class="lab-panel lab-resultado" aria-label="Resultado">
      <div class="lab-pestanas" role="tablist">
        <button type="button" role="tab" id="pest-resultado" aria-controls="vista-resultado" aria-selected="true" data-pestana="resultado">Resultado</button>
        <button type="button" role="tab" id="pest-grafico" aria-controls="vista-grafico" aria-selected="false" data-pestana="grafico" tabindex="-1">Gráfico</button>
        <button type="button" role="tab" id="pest-esquema" aria-controls="vista-esquema" aria-selected="false" data-pestana="esquema" tabindex="-1">Esquema</button>
        <span class="lab-estado" data-estado aria-live="polite"></span>
      </div>
      <div class="lab-vista" id="vista-resultado" role="tabpanel" aria-labelledby="pest-resultado" data-vista="resultado"></div>
      <div class="lab-vista" id="vista-grafico" role="tabpanel" aria-labelledby="pest-grafico" data-vista="grafico" hidden></div>
      <div class="lab-vista" id="vista-esquema" role="tabpanel" aria-labelledby="pest-esquema" data-vista="esquema" hidden></div>
    </section>

    <div class="lab-cargando" data-cargando role="status">
      <span class="marca-faro grande" aria-hidden="true"></span>
      <p>Encendiendo PostgreSQL…</p>
    </div>
  </main>

  <script src="js/tema.js?v=202610151527"></script>
  <script src="js/musica.js?v=202610151527"></script>
  <script src="js/curso.js?v=202610151527"></script>
  <script src="js/progreso.js?v=202610151527"></script>
  <script src="js/motor-sql.js?v=202610151527"></script>
  <script src="js/traductor.js?v=202610151527"></script>
  <script src="js/editor-sql.js?v=202610151527"></script>
  <script src="js/resultado.js?v=202610151527"></script>
  <script src="js/grafico.js?v=202610151527"></script>
  <script src="js/laboratorio.js?v=202610151527"></script>
</body>
</html>
