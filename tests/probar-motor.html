<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Pruebas del motor · SQLearning</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; background: #fff; color: #222; }
    .ok { color: #1a7f37; } .mal { color: #c62828; font-weight: bold; }
    pre { background: #f4f4f4; padding: 8px; white-space: pre-wrap; }
  </style>
  <base href="../">
</head>
<body>
  <h1>Pruebas del motor SQL</h1>
  <p data-resumen>Comprobando…</p>
  <ol data-lista></ol>
  <script src="js/motor-sql.js"></script>
  <script src="js/traductor.js"></script>
  <script src="js/revisor-sql.js"></script>
  <script src="js/pruebas.js"></script>
  <script>
    const lista = document.querySelector("[data-lista]");
    const resultados = [];
    function anotar(nombre, ok, extra = "") {
      resultados.push(ok);
      const li = document.createElement("li");
      li.className = ok ? "ok" : "mal";
      li.textContent = (ok ? "✅ " : "❌ ") + nombre + (extra ? " — " + extra : "");
      lista.append(li);
    }
    async function prueba(nombre, fn) {
      try { const r = await fn(); anotar(nombre, r === true, r === true ? "" : JSON.stringify(r)); }
      catch (e) { anotar(nombre, false, "EXCEPCIÓN: " + (e?.mensaje || e?.message || JSON.stringify(e))); }
    }

    (async () => {
      const t0 = performance.now();
      await MOTOR.preparar("faro-e1");
      anotar("Arranca PostgreSQL y carga faro-e1", true, Math.round(performance.now() - t0) + " ms");
      const esquema = await MOTOR.esquema();
      TRADUCTOR.conocer(esquema);

      await prueba("Esquema: 3 tablas con claves", () => {
        const p = esquema.find(t => t.nombre === "productos");
        const e = esquema.find(t => t.nombre === "empleados");
        return esquema.length === 3 && p.filas === 40 && p.columnas[0].pk && e.columnas.find(c => c.nombre === "tienda_id").fk?.tabla === "tiendas" || esquema;
      });
      await prueba("SELECT básico: 6 tiendas", async () => {
        const r = await MOTOR.ejecutar("SELECT * FROM tiendas;");
        return r.ok && r.ultimo.filas.length === 6 && r.ultimo.columnas.join() === "id,ciudad,apertura" && r.ultimo.filas[0][2] === "1998-05-04" || r;
      });
      await prueba("Tipos: numeric como texto exacto, count como número", async () => {
        const r = await MOTOR.ejecutar("SELECT precio, (SELECT count(*) FROM productos) FROM productos WHERE id = 1;");
        return r.ultimo.filas[0][0] === "749.00" && r.ultimo.filas[0][1] === 40 && r.ultimo.tipos[0] === "numeric" || r;
      });
      await prueba("Stock imposible sembrado (-12)", async () => {
        const r = await MOTOR.ejecutar("SELECT nombre, stock FROM productos ORDER BY stock LIMIT 1;");
        return r.ultimo.filas[0][0] === "Auriculares Sonora Pulse" && r.ultimo.filas[0][1] === -12 || r;
      });
      await prueba("Aislamiento: un DELETE no cambia la base", async () => {
        const d = await MOTOR.ejecutar("DELETE FROM productos;");
        const r = await MOTOR.ejecutar("SELECT count(*) FROM productos;");
        return d.ok && d.ultimo.afectadas === 40 && r.ultimo.filas[0][0] === 40 || [d, r];
      });
      await prueba("Aislamiento: COMMIT del alumno no deja huella", async () => {
        await MOTOR.ejecutar("COMMIT; DELETE FROM tiendas WHERE id = 5; COMMIT;");
        const r = await MOTOR.ejecutar("SELECT count(*) FROM tiendas;");
        return r.ultimo.filas[0][0] === 6 || r;
      });
      await prueba("Error traducido: tabla mal escrita sugiere el nombre", async () => {
        const r = await MOTOR.ejecutar("SELECT *\nFROM producto;");
        return !r.ok && r.error.codigo === "42P01" && r.error.linea === 2 && /productos/.test(r.error.explicacion) || r;
      });
      await prueba("Error traducido: columna inexistente", async () => {
        const r = await MOTOR.ejecutar("SELECT nombre, precios FROM productos;");
        return !r.ok && r.error.codigo === "42703" && /precio/.test(r.error.explicacion) || r;
      });
      await prueba("Error traducido: texto con comillas dobles y espacios → comillas simples", async () => {
        const r = await MOTOR.ejecutar('SELECT nombre || " - " || departamento FROM empleados;');
        return !r.ok && /comillas simples/.test(r.error.explicacion) && !/null/.test(r.error.explicacion) || r.error;
      });
      await prueba("Error traducido: email entre comillas dobles → comillas simples (nombre entero)", async () => {
        const r = await MOTOR.ejecutar('SELECT * FROM empleados WHERE email = "ana.beltran@faro.example";');
        return !r.ok && /'ana\.beltran@faro\.example'/.test(r.error.explicacion) || r.error;
      });
      await prueba("Error traducido: email sin comillas → es un texto", async () => {
        const r = await MOTOR.ejecutar("SELECT * FROM empleados WHERE email = ana.beltran@faro.example;");
        return !r.ok && !/null/.test(r.error.explicacion) || r.error;
      });
      await prueba("Error traducido: sintaxis (coma de más)", async () => {
        const r = await MOTOR.ejecutar("SELECT nombre, FROM productos;");
        return !r.ok && r.error.codigo === "42601" && !!r.error.explicacion || r;
      });
      await prueba("Tiempo límite: consulta infinita se corta y el motor sigue vivo", async () => {
        const r = await MOTOR.ejecutar("WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n) SELECT count(*) FROM n;");
        const s = await MOTOR.ejecutar("SELECT count(*) FROM empleados;");
        return !r.ok && r.error.codigo === "TIEMPO" && s.ok && s.ultimo.filas[0][0] === 22 || [r, s];
      });

      // --- Revisor ---
      const paso = { tipo: "ejercicio", solucion: "SELECT nombre, precio\nFROM productos;" };
      await prueba("Revisor: correcta aunque se escriba distinto", async () =>
        (await REVISOR.revisarEjercicio(paso, "select NOMBRE , precio from productos ;")).ok || "falló");
      await prueba("Revisor: falta el ;", async () => {
        const r = await REVISOR.revisarEjercicio(paso, "SELECT nombre, precio FROM productos");
        return !r.ok && /punto y coma/.test(r.mensaje) || r;
      });
      await prueba("Revisor: sobra columna", async () => {
        const r = await REVISOR.revisarEjercicio(paso, "SELECT nombre, precio, stock FROM productos;");
        return !r.ok && /sobra la columna `stock`/i.test(r.mensaje) || r;
      });
      await prueba("Revisor: COPY … TO STDOUT al revisar da el error explicado (revisión final F5)", async () => {
        const r = await REVISOR.revisarEjercicio(paso, "COPY productos TO STDOUT;");
        return !r.ok && /consola de PostgreSQL/.test(r.mensaje) || r;
      });
      await prueba("Respuestas escritas: formas naturales sí, erróneas no (revisión final F2)", async () => {
        const ok = (d, p) => REVISOR.respuestaCorrecta(d, p);
        const sino = { respuesta: ["no", "no cambia", "no es significativo"] }, quien = { respuesta: ["Héctor Vidal", "Héctor", "Vidal"] };
        const casos = [[sino, "No, la diferencia no es significativa", true], [sino, "Sí, cambia", false], [quien, "Es de Héctor Vidal", true],
          [quien, "Vidal, Héctor", true], [quien, "Iván Soler", false], [quien, "Héctor no", false], [sino, "No sé", false], [{ respuesta: 0 }, "ninguna", true], [{ respuesta: 5 }, "cinco", true],
          [{ respuesta: 49505.85, tolerancia: 0.01 }, "49,505.85", true], [{ respuesta: 36.5, tolerancia: 0.05 }, "57 de 156 = 36,5 %", true],
          [{ respuesta: 89.9, tolerancia: 0.05 }, "90", false], [{ respuesta: -1548 }, "-1.548", true]];
        const mal = casos.filter(([p, d, e]) => ok(d, p) !== e).map(c => c[1]);
        return !mal.length || mal.join(" · ");
      });
      await prueba("Revisor: columnas en otro orden", async () => {
        const r = await REVISOR.revisarEjercicio(paso, "SELECT precio, nombre FROM productos;");
        return !r.ok && /otro orden/.test(r.mensaje) || r;
      });
      await prueba("Revisor: sin ORDER BY en la solución, el orden da igual", async () =>
        (await REVISOR.revisarEjercicio(paso, "SELECT nombre, precio FROM productos ORDER BY precio DESC;")).ok || "falló");
      const pasoOrden = { tipo: "ejercicio", solucion: "SELECT nombre, precio FROM productos ORDER BY precio DESC, nombre;" };
      await prueba("Revisor: con ORDER BY en la solución, el orden cuenta", async () => {
        const r = await REVISOR.revisarEjercicio(pasoOrden, "SELECT nombre, precio FROM productos;");
        return !r.ok && /orden/.test(r.mensaje) || r;
      });
      await prueba("Revisor: ORDER BY dentro de subconsulta no cuenta como orden", () =>
        REVISOR.ordenImporta("SELECT * FROM (SELECT * FROM productos ORDER BY id) t;") === false);
      await prueba("Revisor: faltan filas", async () => {
        const r = await REVISOR.revisarEjercicio(paso, "SELECT nombre, precio FROM productos LIMIT 30;");
        return !r.ok && /faltan 10 filas/.test(r.mensaje) || r;
      });
      await prueba("Revisor: dos consultas cuando se pide una", async () => {
        const r = await REVISOR.revisarEjercicio(paso, "SELECT 1; SELECT nombre, precio FROM productos;");
        return !r.ok && /2 consultas/.test(r.mensaje) || r;
      });
      await prueba("Revisor: un ; dentro de un texto no cuenta", () => REVISOR.sentencias("SELECT 'a;b';").length === 1);
      await prueba("Revisor: tolerancia decimal (2.0 = 2)", () =>
        REVISOR.comparar({ columnas: ["x"], tipos: ["numeric"], filas: [["2.00"]] }, { columnas: ["x"], tipos: ["integer"], filas: [[2]] }).ok);
      await prueba("Revisor: DML con verificar", async () => {
        const p = { tipo: "ejercicio", solucion: "UPDATE productos SET stock = 0 WHERE id = 17;", verificar: "SELECT id, stock FROM productos ORDER BY id;" };
        const bien = await REVISOR.revisarEjercicio(p, "UPDATE productos SET stock = 0 WHERE nombre = 'Auriculares Sonora Pulse';");
        const mal = await REVISOR.revisarEjercicio(p, "UPDATE productos SET stock = 0;");
        return bien.ok && !mal.ok || [bien, mal];
      });

      // --- Regresiones de la revisión QA fase 2 (docs/revisiones/2026-10-15-qa-fase2.md) ---
      const cuenta = async tabla => (await MOTOR.ejecutar(`SELECT count(*) FROM ${tabla};`)).ultimo?.filas[0][0];
      for (const ataque of [
        "ABORT; DELETE FROM productos;",
        "END; DELETE FROM productos;",
        "END WORK; DELETE FROM productos;",
        "END TRANSACTION; DELETE FROM productos;",
        "SELECT $$'$$; COMMIT; DELETE FROM productos; SELECT $$'$$;",
        "COMMIT; BEGIN; DELETE FROM productos;"
      ]) {
        await prueba(`F1: «${ataque.slice(0, 32)}…» no deja huella`, async () => {
          await MOTOR.ejecutar(ataque);
          const n = await cuenta("productos");
          return n === 40 || n;
        });
      }
      await prueba("F1: ABORT + SET search_path no rompe las consultas siguientes", async () => {
        await MOTOR.ejecutar("ABORT; SET search_path TO pg_catalog;");
        return (await cuenta("productos")) === 40;
      });
      await prueba("F1: el revisor no se deja engañar tras un ABORT", async () => {
        await REVISOR.revisarEjercicio({ solucion: "SELECT nombre FROM productos;" }, "SELECT $$'$$; ABORT; DELETE FROM productos; SELECT nombre FROM productos WHERE nombre <> $$'$$;");
        const r = await REVISOR.revisarEjercicio({ solucion: "SELECT count(*) AS n FROM productos;" }, "SELECT 0 AS n;");
        return !r.ok || r;
      });
      await prueba("F10: PREPARE dos veces no da error (se limpia la sesión)", async () => {
        await MOTOR.ejecutar("PREPARE p1 AS SELECT 1;");
        const r = await MOTOR.ejecutar("PREPARE p1 AS SELECT 1;");
        return r.ok || r;
      });
      await prueba("F4: empates en el ORDER BY de la solución: otro desempate vale", async () => {
        const p = { solucion: "SELECT departamento, count(*) AS empleados FROM empleados GROUP BY departamento ORDER BY empleados DESC;" };
        const bien = await REVISOR.revisarEjercicio(p, "SELECT departamento, count(*) AS empleados FROM empleados GROUP BY departamento ORDER BY empleados DESC, departamento DESC;");
        const mal = await REVISOR.revisarEjercicio(p, "SELECT departamento, count(*) AS empleados FROM empleados GROUP BY departamento ORDER BY empleados;");
        return bien.ok && !mal.ok || [bien, mal];
      });
      await prueba("F4: ORDER BY por expresión → orden exacto (sin claves)", () =>
        REVISOR.clavesOrden("SELECT nombre, precio * stock AS v FROM productos ORDER BY precio * stock;", ["nombre", "v"]) === null);
      await prueba("F4: claves por alias, posición y tabla.columna", () =>
        JSON.stringify(REVISOR.clavesOrden("SELECT p.nombre, p.precio AS \"Precio\" FROM productos p ORDER BY \"Precio\" DESC, 1, p.nombre LIMIT 3;", ["nombre", "Precio"])) === "[1,0,0]");
      await prueba("F5: PRUEBA.ordenado sigue el orden de PostgreSQL («Óscar» al final)", async () => {
        const r = (await MOTOR.ejecutar("SELECT nombre FROM empleados ORDER BY nombre;")).ultimo;
        return PRUEBA.ordenado(r, "nombre", "asc") || r.filas.map(f => f[0]);
      });
      await prueba("F7: fecha = misma fecha como timestamp", async () =>
        (await REVISOR.revisarEjercicio({ solucion: "SELECT ciudad, apertura FROM tiendas;" }, "SELECT ciudad, apertura::timestamp AS apertura FROM tiendas;")).ok || "falló");
      await prueba("F8: «--» dentro de un texto y ; dentro de $$ no confunden", () =>
        REVISOR.bienEscrita("SELECT nombre FROM productos WHERE nombre LIKE '%--%';").ok &&
        REVISOR.bienEscrita("SELECT nombre FROM productos WHERE nombre <> $$a;b$$;").ok);
      await prueba("F9: bigint enorme se conserva exacto", async () => {
        const r = await MOTOR.ejecutar("SELECT 9007199254740993::bigint;");
        return String(r.ultimo.filas[0][0]) === "9007199254740993" || r.ultimo.filas;
      });
      await prueba("F9: numeric enorme distinto no se aprueba", async () =>
        !(await REVISOR.revisarEjercicio({ solucion: "SELECT 12345678901234567.1::numeric AS x;" }, "SELECT 12345678901234567.2::numeric AS x;")).ok);
      await prueba("Tolerancia: 1234567 ≠ 1234568", () =>
        !REVISOR.comparar({ columnas: ["x"], tipos: ["integer"], filas: [[1234567]] }, { columnas: ["x"], tipos: ["integer"], filas: [[1234568]] }).ok);
      await prueba("F11: COPY FROM STDIN responde al instante", async () => {
        const r = await MOTOR.ejecutar("COPY productos FROM STDIN;");
        return !r.ok && r.error.codigo === "STDIN" && r.ms < 100 || r;
      });
      // Revisión etapas 5–7
      await prueba("QA57-F1: COMMIT; BEGIN; <error> no deja cambios", async () => {
        await MOTOR.ejecutar("DELETE FROM productos WHERE id > 30; COMMIT; BEGIN; SELECT 1/0;");
        return (await cuenta("productos")) === 40 || "quedaron cambios";
      });
      await prueba("QA57-F9: fingir la marca tras COMMIT no engaña al motor", async () => {
        await MOTOR.ejecutar("COMMIT; CREATE TABLE basura (x int); SET sqlearning.marca = '1';");
        return !(await MOTOR.ejecutar("SELECT * FROM basura;")).ok || "la tabla sigue";
      });
      await prueba("QA57-F2: las fechas con zona salen en UTC", async () => {
        const r = await MOTOR.ejecutar("SELECT '2024-01-01'::timestamptz AS t;");
        return /\+00$/.test(String(r.ultimo.filas[0][0])) || r.ultimo.filas;
      });
      await prueba("QA57-F10: JSON se muestra como JSON", async () => {
        const r = await MOTOR.ejecutar(`SELECT '[1,2]'::jsonb AS a;`);
        return r.ultimo.filas[0][0] === "[1,2]" || r.ultimo.filas;
      });
      await prueba("QA57-F4: errores de la etapa 6 traducidos", async () => {
        const r = await MOTOR.ejecutar("CREATE TABLE t (id int GENERATED ALWAYS AS IDENTITY); INSERT INTO t (id) VALUES (1);");
        return /se numera sola/.test(r.error?.explicacion || "") || r.error;
      });
      await prueba("Tras todos los ataques, la base sigue intacta", async () =>
        (await cuenta("productos")) === 40 && (await cuenta("empleados")) === 22 && (await cuenta("tiendas")) === 6);

      // --- Reto con PRUEBA ---
      const reto = {
        comprobaciones: [
          { texto: "5 filas", prueba: r => r.filas.length === 5 },
          { texto: "columnas", prueba: r => PRUEBA.columnas(r, ["nombre", "stock"]) },
          { texto: "orden", prueba: r => PRUEBA.ordenado(r, "stock", "desc") },
          { texto: "igual", prueba: (r, db) => PRUEBA.igualA(r, db, "SELECT nombre, stock FROM productos ORDER BY stock DESC LIMIT 5;") }
        ]
      };
      await prueba("Reto: la solución pasa todo", async () => {
        const r = await REVISOR.revisarReto(reto, "SELECT nombre, stock FROM productos ORDER BY stock DESC LIMIT 5;");
        return r.ok && r.filas.length === 5 || r;
      });
      await prueba("Reto: sin orden falla solo lo que toca", async () => {
        const r = await REVISOR.revisarReto(reto, "SELECT nombre, stock FROM productos LIMIT 5;");
        return !r.ok && r.filas[0].ok && r.filas[1].ok && !r.filas[2].ok && r.filas[4].ok || r;
      });
      await prueba("Reto: con error de SQL marca todo en rojo", async () => {
        const r = await REVISOR.revisarReto(reto, "SELECT nombre, stok FROM productos;");
        return !r.ok && r.filas.every(f => !f.ok) && /stock/.test(r.mensaje) || r;
      });

      const bien = resultados.filter(Boolean).length;
      document.querySelector("[data-resumen]").textContent =
        `${bien === resultados.length ? "✅" : "❌"} ${bien}/${resultados.length} pruebas superadas en ${Math.round(performance.now() - t0)} ms`;
    })();
  </script>
</body>
</html>
